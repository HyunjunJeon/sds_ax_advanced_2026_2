[project]
name = "day08-agent-guardrails"
version = "0.1.0"
description = "Day08: DeepAgents에 Guardrail을 연결하고 공격 유형별 방어 효과를 비교한다"
requires-python = ">=3.13,<3.14"
# Day05·Day07 과 겹치는 패키지는 같은 버전으로 고정한다.
# torch·transformers 는 LFM PII-Detector 로컬 실행용이다. Linux/WSL 은 CPU 인덱스를 쓴다.
dependencies = [
  "deepagents==0.7.13",
  "langchain==1.4.0",
  "langchain-core==1.6.2",
  "langgraph==1.2.11",
  "langgraph-checkpoint-sqlite==3.1.1",
  "langchain-openrouter==0.2.8",
  "openrouter==0.10.8",
  "httpx==0.28.1",
  "python-dotenv>=1.2,<2",
  "torch>=2.8",
  "transformers>=4.57",
]

[dependency-groups]
dev = ["pytest>=9,<10"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.uv]
package = false

[tool.pytest.ini_options]
# 모두 모델·네트워크 호출 없이 도는 테스트다. 설치 확인용으로 비용 없이 돌릴 수 있다.
testpaths = ["tests"]
pythonpath = ["."]
# ToolRuntime 직렬화 시 context 필드 경고. 동작에는 영향이 없다 (guardlab/__init__.py 참고).
filterwarnings = ["ignore:Pydantic serializer warnings"]

[tool.pyright]
extraPaths = ["."]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
